<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <span class="footer-name">{{ site.author.name | escape }}</span>
    <nav class="footer-links" aria-label="Footer links">
      <a href="mailto:{{ site.author.email }}">Email</a>
      {%- if site.minima.social_links.github -%}
      <a href="https://github.com/{{ site.minima.social_links.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      {%- endif -%}
      {%- if site.minima.social_links.linkedin -%}
      <a href="https://linkedin.com/in/{{ site.minima.social_links.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      {%- endif -%}
    </nav>
  </div>
</footer>
