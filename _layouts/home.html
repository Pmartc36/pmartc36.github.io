---
layout: default
---

<div class="home">

  <section class="hero">
    <h1 class="hero-name">{{ site.title | escape }}</h1>
    <p class="hero-role">{{ site.description | escape }}</p>
  </section>

  <section class="about">
    <div class="about-body">
      <p class="section-label">About</p>
      {{ content }}
    </div>
    <img src="{{ '/uploads/pfp.png' | relative_url }}" alt="{{ site.author.name | escape }}" class="about-photo">
  </section>

  <section class="recent-writing">
    <p class="section-label">Writing</p>
    {%- assign posts = site.posts | limit: 5 -%}
    {%- for post in posts -%}
    <div class="post-row">
      <time class="post-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      <a class="post-title-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    </div>
    {%- endfor -%}
    <a class="view-all" href="{{ '/writing/' | relative_url }}">All posts &rarr;</a>
  </section>

</div>
