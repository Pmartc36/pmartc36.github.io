---
layout: default
---

<div class="post-page">

  <header class="post-page-header">
    <h1 class="post-page-title">{{ page.title | escape }}</h1>
    <p class="post-page-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {%- assign date_format = site.minima.date_format | default: "%B %-d, %Y" -%}
        {{ page.date | date: date_format }}
      </time>
    </p>
  </header>

  <div class="post-page-body">
    {{ content }}
  </div>

  <nav class="post-back" aria-label="Post navigation">
    <a href="{{ '/writing/' | relative_url }}">&larr; Back to writing</a>
  </nav>

</div>
